# 每日自动执行领克App签到 + 分享，并通过飞书群机器人推送结果。
# 敏感字段（账号 token/deviceId、应用签名密钥、飞书 webhook）均通过仓库
# Secrets 提供，代码中不含任何默认值，未配置会直接报错退出，获取方式见 readme.md。
# 说明：
#   - 登录环节存在滑块验证码，无法在 CI 中完全自动化，本工作流依赖
#     refreshToken 自动续期获取 token（约30天有效，需定期人工更新）。
#     接口每次续期返回的是新签发 token 的有效期，看不出 Secret 里旧 token
#     还剩多久，因此用 actions/cache 跨运行保存首次观测日期，剩余不足 7 天
#     时在推送卡片顶部显示警告（见 lynkco_login.track_refresh_token_age）。
#   - LYNKCO_APP_SECRETS 是领克官方 App 的应用级共用签名密钥集合
#     （非个人账号凭证），一个 JSON 字符串 Secret 整合以下 4 个独立字段，
#     必须配置，否则脚本无法计算请求签名。
#   - 首次执行失败会自动重试 2 次（attempt 2/3）；三次均失败时推送一条
#     飞书告警并让 job 标红。注意：GitHub schedule 被丢弃（根本没跑）时
#     平台内无法感知，如需兜底请用外部定时任务调 GitHub API 检查/触发。

name: LynkCoHelperRunner

on:
  schedule:
    # 每天 UTC 17:15（北京时间次日凌晨 1:15）执行。特意避开整点（GitHub
    # 整点为高负载时段，调度延迟与丢弃率明显更高）。GitHub 调度仍可能有
    # 延迟（延后数分钟到数小时）。需要精确触发可用 iOS 快捷指令等定时
    # 调用 GitHub API 主动触发（注意：API 路径中的 workflow 文件名需与
    # 本文件名保持一致）。
    - cron: "15 17 * * *"
  workflow_dispatch:

jobs:
  daily-tasks:

    runs-on: ubuntu-latest

    env:
      # refreshToken 自动续期获取 token，详见 lynkco_login.load_token()
      LYNKCO_REFRESH_TOKEN: ${{ secrets.LYNKCO_REFRESH_TOKEN }}
      LYNKCO_DEVICE_ID: ${{ secrets.LYNKCO_DEVICE_ID }}
      # 飞书群机器人推送，详见 lynkco_notify.py：
      # LYNKCO_FEISHU_WEBHOOK 是群机器人的完整 webhook 地址
      # （https://open.feishu.cn/open-apis/bot/v2/hook/xxxx）；
      # LYNKCO_FEISHU_SECRET 仅在机器人开启“加签”安全校验时需要。
      LYNKCO_FEISHU_WEBHOOK: ${{ secrets.LYNKCO_FEISHU_WEBHOOK }}
      LYNKCO_FEISHU_SECRET: ${{ secrets.LYNKCO_FEISHU_SECRET }}
      # App 共用签名密钥集合（JSON 字符串，详见 lynkco_common.py），必须配置，
      # 否则脚本会在计算签名时报错退出。字段名与 env.json 的 secrets 段一致：
      # {"nativeAppKey":"","nativeAppSecret":"","nativeAppCode":"",
      #  "loginAppCode":""}
      LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
      LYNKCO_TIMEOUT: ${{ vars.LYNKCO_TIMEOUT || '30' }}
      LYNKCO_RETRIES: ${{ vars.LYNKCO_RETRIES || '2' }}

    steps:
    - name: CheckOut
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f ./LynkCoHelper/requirements.txt ]; then pip install -r ./LynkCoHelper/requirements.txt; fi
    - name: Restore refreshToken age cache
      # runner 是一次性的，普通文件跨运行留不住；这里用 cache 保存
      # .token_meta.json（只含 token 指纹与首次观测日期，不含 token 本身），
      # 供脚本估算 Secret 中 refreshToken 的真实到期日。
      uses: actions/cache/restore@v4
      with:
        path: LynkCoHelper/.token_meta.json
        key: token-meta-${{ github.run_id }}
        restore-keys: |
          token-meta-
    - name: Run sign-in and notify (attempt 1)
      id: run1
      continue-on-error: true
      run: |
        python ./LynkCoHelper/lynkco_daily_tasks.py
    - name: Retry if failed (attempt 2)
      id: run2
      if: steps.run1.outcome == 'failure'
      continue-on-error: true
      run: |
        python ./LynkCoHelper/lynkco_daily_tasks.py
    - name: Retry if failed (attempt 3)
      id: run3
      if: steps.run2.outcome == 'failure'
      continue-on-error: true
      run: |
        python ./LynkCoHelper/lynkco_daily_tasks.py
    - name: Save refreshToken age cache
      # 无论任务成败都保存（续期可能已发生），key 用 run_id 保证每次都能写入。
      if: always()
      uses: actions/cache/save@v4
      with:
        path: LynkCoHelper/.token_meta.json
        key: token-meta-${{ github.run_id }}
    - name: Alert failure to Feishu
      # 三次均失败才告警；本步骤失败（如飞书不可达）不影响 job 结论。
      if: steps.run3.outcome == 'failure'
      continue-on-error: true
      working-directory: ./LynkCoHelper
      run: |
        python - <<'PYEOF'
        from datetime import datetime

        from lynkco_notify import send_feishu_notification

        send_feishu_notification(
            "领克App · 任务失败告警",
            "**今日定时任务三次执行均失败**\n"
            f"- 时间：{datetime.now().strftime('%Y-%m-%d %H:%M')}（UTC）\n"
            "- 可能原因：refreshToken 过期 / 网络异常 / 接口变更\n"
            "- 排查日志：https://github.com/brian007-ai/LynkCoHelper/actions",
        )
        PYEOF
    - name: Mark job failed
      # 告警发出后仍把 job 标红，Actions 列表里一眼可见。
      if: steps.run3.outcome == 'failure'
      run: |
        exit 1
