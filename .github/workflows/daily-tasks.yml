# 每日自动执行领克App签到 + 分享，并通过飞书群机器人推送结果。
# 敏感字段（账号 token/deviceId、应用签名密钥、飞书 webhook）均通过仓库
# Secrets 提供，代码中不含任何默认值，未配置会直接报错退出，获取方式见 readme.md。
# 说明：
#   - 登录环节存在滑块验证码，无法在 CI 中完全自动化，本工作流依赖
#     refreshToken 自动续期获取 token（约30天有效，需定期人工更新）。
#   - LYNKCO_APP_SECRETS 是领克官方 App 的应用级共用签名密钥集合
#     （非个人账号凭证），一个 JSON 字符串 Secret 整合以下 4 个独立字段，
#     必须配置，否则脚本无法计算请求签名。

name: LynkCoHelperRunner

on:
  schedule:
    # 每天 UTC 0:30（北京时间 8:30）执行，GitHub 调度有延迟（可能延后数分钟到
    # 数小时）。需要精确触发可用 iOS 快捷指令等定时调用 GitHub API 主动触发
    # （注意：API 路径中的 workflow 文件名需与本文件名保持一致）。
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  daily-tasks:

    runs-on: ubuntu-latest

    steps:
    - name: CheckOut
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f ./LynkCoHelper/requirements.txt ]; then pip install -r ./LynkCoHelper/requirements.txt; fi
    - name: Run sign-in and notify
      env:
        # refreshToken 自动续期获取 token，详见 lynkco_login.load_token()
        LYNKCO_REFRESH_TOKEN: ${{ secrets.LYNKCO_REFRESH_TOKEN }}
        LYNKCO_DEVICE_ID: ${{ secrets.LYNKCO_DEVICE_ID }}
        # 飞书群机器人推送，详见 lynkco_notify.py：
        # LYNKCO_FEISHU_WEBHOOK 是群机器人的完整 webhook 地址
        # （https://open.feishu.cn/open-apis/bot/v2/hook/xxxx）；
        # LYNKCO_FEISHU_SECRET 仅在机器人开启“加签”安全校验时需要。
        LYNKCO_FEISHU_WEBHOOK: ${{ secrets.LYNKCO_FEISHU_WEBHOOK }}
        LYNKCO_FEISHU_SECRET: ${{ secrets.LYNKCO_FEISHU_SECRET }}
        # App 共用签名密钥集合（JSON 字符串，详见 lynkco_common.py），必须配置，
        # 否则脚本会在计算签名时报错退出。字段名与 env.json 的 secrets 段一致：
        # {"nativeAppKey":"","nativeAppSecret":"","nativeAppCode":"",
        #  "loginAppCode":""}
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
        LYNKCO_TIMEOUT: ${{ vars.LYNKCO_TIMEOUT || '30' }}
        LYNKCO_RETRIES: ${{ vars.LYNKCO_RETRIES || '2' }}
      run: |
        python ./LynkCoHelper/lynkco_daily_tasks.py
